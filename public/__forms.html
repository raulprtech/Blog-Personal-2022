<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Contact form</title>
  </head>
  <body>
    <form
      name="professional-inquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="website"
      hidden
    >
      <input type="hidden" name="form-name" value="professional-inquiry" />
      <input name="website" />
      <input name="name" />
      <input type="email" name="reply_email" />
      <input name="organization" />
      <select name="opportunity">
        <option>Scientific collaboration</option>
      </select>
      <input type="url" name="relevant_url" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
